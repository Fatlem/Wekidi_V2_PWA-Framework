[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA: semua alamat (/menu, /about, /login, ...) diarahkan ke index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Service worker jangan di-cache lama supaya update situs cepat sampai ke pengguna
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
